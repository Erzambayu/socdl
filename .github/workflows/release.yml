name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.1.0). Leave empty to use current ref."
        required: false

permissions:
  contents: write      # create GitHub Release + upload assets
  id-token: write      # PyPI trusted publishing (OIDC)

jobs:
  # ---------------------------------------------------------------------------
  # 1. Build standalone binaries (PyInstaller) for Windows & Linux
  # ---------------------------------------------------------------------------
  binaries:
    name: binary · ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            artifact: socdl-windows-x64.exe
          - name: linux-x64
            os: ubuntu-latest
            artifact: socdl-linux-x64

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install build deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[build]"

      - name: Build binary (PyInstaller)
        run: pyinstaller socdl.spec --clean --noconfirm

      # --- Windows post-processing ---
      - name: Rename (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item dist/socdl.exe "dist/${{ matrix.artifact }}"

      # --- Linux post-processing ---
      - name: Rename (Linux)
        if: runner.os == 'Linux'
        run: |
          cp dist/socdl "dist/${{ matrix.artifact }}"
          chmod +x "dist/${{ matrix.artifact }}"

      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          dist/socdl.exe --version
          dist/socdl.exe --help | Select-Object -First 5

      - name: Smoke test (Linux)
        if: runner.os == 'Linux'
        run: |
          ./dist/${{ matrix.artifact }} --version
          ./dist/${{ matrix.artifact }} --help | head -5

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # 2. Build wheel + sdist for pip users
  # ---------------------------------------------------------------------------
  python-package:
    name: wheel + sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - uses: actions/upload-artifact@v7
        with:
          name: python-dist
          path: dist/

  # ---------------------------------------------------------------------------
  # 3. Create the GitHub Release and attach all assets
  # ---------------------------------------------------------------------------
  release:
    name: publish GitHub Release
    needs: [binaries, python-package]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Download binaries
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Download python package
        uses: actions/download-artifact@v8
        with:
          name: python-dist
          path: artifacts/python-dist

      - name: List artifacts
        run: find artifacts -type f | sort

      # Build the release body from CHANGELOG.md so every release always
      # carries human-written notes. Falls back to auto-generated notes when
      # no matching section exists.
      - name: Build release notes from CHANGELOG.md
        shell: bash
        run: |
          set -e
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          BODY_FILE="$RUNNER_TEMP/release_body.md"
          if python3 scripts/changelog_for_version.py "$VERSION" > "$BODY_FILE"; then
            echo "release body sourced from CHANGELOG.md:"
            cat "$BODY_FILE"
            echo "BODY_SOURCE=changelog" >> "$GITHUB_ENV"
          else
            echo "no changelog section for $VERSION; using generated notes"
            echo "BODY_SOURCE=generated" >> "$GITHUB_ENV"
          fi
          echo "BODY_FILE=$BODY_FILE" >> "$GITHUB_ENV"

      - name: Create GitHub Release (from CHANGELOG.md)
        id: rel_changelog
        if: env.BODY_SOURCE == 'changelog'
        continue-on-error: true
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: socdl ${{ github.event.inputs.tag || github.ref_name }}
          body_path: ${{ env.BODY_FILE }}
          fail_on_unmatched_files: true
          files: |
            artifacts/socdl-windows-x64.exe/socdl-windows-x64.exe
            artifacts/socdl-linux-x64/socdl-linux-x64
            artifacts/python-dist/*

      - name: Create GitHub Release (auto notes fallback)
        if: env.BODY_SOURCE != 'changelog' || steps.rel_changelog.outcome == 'failure'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: socdl ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            artifacts/socdl-windows-x64.exe/socdl-windows-x64.exe
            artifacts/socdl-linux-x64/socdl-linux-x64
            artifacts/python-dist/*

  # ---------------------------------------------------------------------------
  # 4. Publish to PyPI (only on tag pushes).
  #
  #    Requires one-time setup of PyPI Trusted Publishing:
  #      https://pypi.org/manage/account/publishing/
  #        owner:            Erzambayu
  #        repository:       socdl
  #        workflow:         release.yml
  #        environment:      pypi
  #
  #    Until that's configured, this job is allowed to fail without failing
  #    the whole release (the GitHub Release + binaries are already live).
  #    Set PYPI_TRUSTED_PUBLISHER=1 in the repo variables to make it required.
  # ---------------------------------------------------------------------------
  pypi:
    name: publish PyPI
    needs: [python-package]
    if: startsWith(github.ref, 'refs/tags/v')
    continue-on-error: ${{ vars.PYPI_TRUSTED_PUBLISHER != '1' }}
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/socdl
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: python-dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        continue-on-error: true
